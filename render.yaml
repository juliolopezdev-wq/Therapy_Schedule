services:
  - type: web
    name: therapy-board
    env: node
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PNPM_VERSION
        value: 10
      # Node's local-time functions (setHours, toLocaleDateString, etc.) follow this. Without it
      # Render defaults to UTC, so "today" at the server can roll over hours before/after it does
      # at the facility -- change this to your facility's IANA zone if it's not US Eastern.
      - key: TZ
        value: America/New_York
      - key: DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DIGEST_NOTIFICATION_EMAILS
        sync: false
